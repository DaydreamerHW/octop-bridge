[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "octop-bridge"
version = "0.2.0"
description = "A universal client and AgentSkill bridge to chat and delegate tasks to self-hosted Octop AI agents"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Xia Qian" },
    { name = "Hermes Agent" }
]
keywords = [
    "octop",
    "ai-agent",
    "agent-skills",
    "multi-agent",
    "bridge",
    "llm",
    "nas",
    "hermes-agent"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "websockets>=11.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
]

[project.scripts]
octop-bridge = "octop_bridge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["octop_bridge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
